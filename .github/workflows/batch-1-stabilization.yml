name: FloodGuard Build and API Validation

on:
  push:
    branches:
      - main
      - "batch-1/**"
      - "batch-2/**"
      - "batch-3/**"
      - "batch-4/**"
  pull_request:
    branches:
      - main
      - "batch-1/**"
      - "batch-2/**"
      - "batch-3/**"
      - "batch-4/**"

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend TypeScript and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Run frontend unit tests
        run: npm test

  backend-smoke:
    name: Backend API and authentication tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install fastapi uvicorn pydantic-settings firebase-admin httpx pytest
      - name: Compile backend modules
        run: python -m compileall -q app
      - name: Run API and authentication tests
        env:
          PYTHONPATH: .
          ENVIRONMENT: development
        run: python -m pytest -q
